<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bingo</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{overflow:hidden;background:black}

canvas{display:block}

.menu{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(to top,#ff5e00,#ff9966,#87ceeb);
}

.menu h1{
font-size:60px;
color:white;
text-shadow:0 0 25px gold;
margin-bottom:50px;
}

.menu button{
padding:25px 100px;
font-size:32px;
margin:30px;
border:none;
border-radius:20px;
cursor:pointer;
background:gold;
box-shadow:0 0 25px orange;
}

.avatarScreen{
position:absolute;
width:100%;
height:100%;
display:none;
flex-direction:column;
align-items:center;
background:linear-gradient(to top,#ff5e00,#ff9966,#87ceeb);
overflow:auto;
}

.avatarGrid{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
margin-top:40px;
}

.avatarItem{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
cursor:pointer;
width:180px;
}

.backBtn{
position:absolute;
top:200px;
left:20px;
font-size:30px;
cursor:pointer;
background:white;
padding:10px 15px;
border-radius:10px;
}

.score{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:45px;
color:gold;
text-shadow:4px 4px 8px black;
display:none;
}

.best{
position:absolute;
top:20px;
left:20px;
color:white;
font-size:18px;
}

.musicBtn{
position:absolute;
top:20px;
right:20px;
padding:10px 20px;
background:black;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="menu" id="menu">
<h1>FLAPPY BINGO</h1>
<button onclick="startGame()">JOGAR</button>
<button onclick="openAvatars()">AVATARES</button>
</div>

<div class="avatarScreen" id="avatars">
<div class="backBtn" onclick="backMenu()">⬅</div>
<h1>AVATARES</h1>
<div class="avatarGrid" id="avatarGrid"></div>
</div>

<div class="score" id="score">0</div>

<div class="best">
Recorde: <span id="bestScore">0</span><br>
Moedas: <span id="coinCount">0</span>
</div>

<button class="musicBtn" onclick="toggleMusic()">🎵 ON</button>

<audio id="lofi" loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_6c4f9b5c8f.mp3" type="audio/mpeg">
</audio>

<audio id="gameoverSound">
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_8b0f5c6b2f.mp3" type="audio/mpeg">
</audio>

<canvas id="game"></canvas>

<script>

// ===== AUDIO =====
const lofi=document.getElementById("lofi");
const gameoverSound=document.getElementById("gameoverSound");
let musicOn=true;

function toggleMusic(){
musicOn=!musicOn;
if(musicOn){lofi.play();document.querySelector(".musicBtn").innerText="🎵 ON";}
else{lofi.pause();document.querySelector(".musicBtn").innerText="🔇 OFF";}
}

// ===== CANVAS =====
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

// ===== CONFIG =====
let gravity=0.45;
let jump=9;
let baseSpeed=3;
let gameSpeed=3;

let score=0;
let bestScore=parseInt(localStorage.getItem("best"))||0;
let coins=parseInt(localStorage.getItem("coins"))||0;

document.getElementById("bestScore").innerText=bestScore;
document.getElementById("coinCount").innerText=coins;

let gameState="menu";

let adminMode=false;
let keysPressed={};

// ===== SKINS =====
const skins=[
{id:"yellow",name:"Amarelo",price:5,color:"gold"},
{id:"bw",name:"Preto & Branco",price:20,color:"stripe"},
{id:"rgb",name:"RGB",price:50,color:"rgb"},
{id:"lava",name:"Lava",price:150,color:"lava"},
{id:"diamond",name:"Diamante",price:300,color:"diamond"},
{id:"electric",name:"Elétrico",price:500,color:"electric"},
{id:"galaxy",name:"Galáxia",price:800,color:"galaxy"},
{id:"king",name:"Rei Supremo",price:1200,color:"king"},
{id:"neon",name:"Neon",price:2000,color:"neon"},
{id:"shadow",name:"Sombra",price:3000,color:"shadow"}
];

let selectedSkin="yellow";
let owned=["yellow"];

const grid=document.getElementById("avatarGrid");

skins.forEach(s=>{
let div=document.createElement("div");
div.className="avatarItem";
div.innerHTML=`<h3>${s.name}</h3><p>${s.price} moedas</p>`;
div.onclick=()=>{
if(!owned.includes(s.id)){
if(coins>=s.price){
coins-=s.price;
localStorage.setItem("coins",coins);
document.getElementById("coinCount").innerText=coins;
owned.push(s.id);
}else{alert("Moedas insuficientes!");return;}
}
selectedSkin=s.id;
backMenu();
};
grid.appendChild(div);
});

// ===== MENU =====
function startGame(){
gameState="playing";
gameSpeed=baseSpeed;
score=0;
bird.y=canvas.height/2;
bird.velocity=0;
pipes=[];
coinsCollected=0;

document.getElementById("menu").style.display="none";
document.getElementById("avatars").style.display="none";
document.getElementById("score").style.display="block";

if(musicOn){lofi.volume=0.4;lofi.play();}
}

function openAvatars(){
document.getElementById("menu").style.display="none";
document.getElementById("avatars").style.display="flex";
}

function backMenu(){
gameState="menu";
document.getElementById("menu").style.display="flex";
document.getElementById("avatars").style.display="none";
document.getElementById("score").style.display="none";
}

// ===== BIRD =====
let bird={x:120,y:200,velocity:0};

// ===== PIPES =====
let pipes=[];
let pipeCounter=0;

function spawnPipe(){
let gap=220;
let topHeight=Math.random()*canvas.height/2;
pipes.push({x:canvas.width,top:topHeight,bottom:topHeight+gap,passed:false});
pipeCounter++;
}
setInterval(()=>{if(gameState==="playing")spawnPipe();},1800);

// ===== COIN =====
let coin=null;
let coinsCollected=0;

function spawnCoin(){
coin={
x:canvas.width,
y:Math.random()*canvas.height/2+100,
size:12
};
}

function drawCoin(){
if(!coin)return;
ctx.fillStyle="gold";
ctx.beginPath();
ctx.arc(coin.x,coin.y,coin.size,0,Math.PI*2);
ctx.fill();
}

// ===== CLOUDS =====
let clouds=[];
for(let i=0;i<8;i++){
clouds.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height/2});
}

function drawCloud(c){
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(c.x,c.y,35,0,Math.PI*2);
ctx.arc(c.x+40,c.y+10,30,0,Math.PI*2);
ctx.arc(c.x-40,c.y+10,30,0,Math.PI*2);
ctx.fill();
}

// ===== DRAW BIRD =====
function drawBird(){
ctx.save();
ctx.translate(bird.x,bird.y);

let wingUp = bird.velocity < 0;

// Corpo base
ctx.beginPath();
ctx.ellipse(0,0,22,16,0,0,Math.PI*2);

// ===== TEXTURAS =====
if(selectedSkin==="rgb"){
ctx.fillStyle=`hsl(${Date.now()/5%360},100%,50%)`;
}
else if(selectedSkin==="bw"){
let g=ctx.createLinearGradient(-20,0,20,0);
g.addColorStop(0,"black");
g.addColorStop(0.5,"white");
g.addColorStop(1,"black");
ctx.fillStyle=g;
}
else if(selectedSkin==="lava"){
let g=ctx.createRadialGradient(0,0,5,0,0,25);
g.addColorStop(0,"yellow");
g.addColorStop(1,"red");
ctx.fillStyle=g;
}
else if(selectedSkin==="diamond"){
let g=ctx.createLinearGradient(-20,-15,20,15);
g.addColorStop(0,"white");
g.addColorStop(0.5,"#00eaff");
g.addColorStop(1,"white");
ctx.fillStyle=g;
}
else if(selectedSkin==="electric"){
ctx.fillStyle="#00ccff";
}
else if(selectedSkin==="galaxy"){
ctx.fillStyle="#6a0dad";
}
else if(selectedSkin==="king"){
ctx.fillStyle="gold";
}
else if(selectedSkin==="neon"){
ctx.fillStyle="#39ff14";
}
else if(selectedSkin==="shadow"){
ctx.fillStyle="black";
}
else{
ctx.fillStyle="gold";
}

ctx.fill();

// ===== EFEITOS EXTRAS =====

// Lava pingando
if(selectedSkin==="lava"){
for(let i=0;i<3;i++){
ctx.fillStyle="orange";
ctx.beginPath();
ctx.arc(Math.random()*20-10,20+Math.random()*10,3,0,Math.PI*2);
ctx.fill();
}
}

// Elétrico raios
if(selectedSkin==="electric"){
ctx.strokeStyle="yellow";
ctx.lineWidth=2;
ctx.beginPath();
ctx.moveTo(-25,-10);
ctx.lineTo(-35,0);
ctx.lineTo(-25,10);
ctx.stroke();
}

// Galáxia aura
if(selectedSkin==="galaxy"){
ctx.fillStyle="black";
ctx.globalAlpha=0.4;
ctx.beginPath();
ctx.arc(0,0,35,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=1;
}

// Rei capa e coroa
if(selectedSkin==="king"){
// capa
ctx.fillStyle="red";
ctx.fillRect(-25,5,20,25);

// coroa
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.moveTo(-10,-20);
ctx.lineTo(-5,-30);
ctx.lineTo(0,-20);
ctx.lineTo(5,-30);
ctx.lineTo(10,-20);
ctx.closePath();
ctx.fill();

// pedras verdes
ctx.fillStyle="green";
ctx.beginPath();
ctx.arc(-5,-30,3,0,Math.PI*2);
ctx.arc(5,-30,3,0,Math.PI*2);
ctx.fill();
}

// Asa
if(wingUp){
ctx.fillStyle="white";
ctx.beginPath();
ctx.ellipse(-5,0,15,8,0,0,Math.PI*2);
ctx.fill();
}

// Olho
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(7,-4,4,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="black";
ctx.beginPath();
ctx.arc(8,-4,2,0,Math.PI*2);
ctx.fill();

// Bico
ctx.fillStyle="orange";
ctx.beginPath();
ctx.moveTo(22,0);
ctx.lineTo(32,-5);
ctx.lineTo(32,5);
ctx.closePath();
ctx.fill();

ctx.restore();
}

// ===== LOOP =====
function update(){
ctx.clearRect(0,0,canvas.width,canvas.height);

// Fundo céu
ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,canvas.width,canvas.height);

// Nuvens
clouds.forEach(c=>{
c.x-=1;
if(c.x<-60)c.x=canvas.width+60;
drawCloud(c);
});

if(gameState==="playing"){

// Auto admin
if(adminMode && pipes.length>0){
let nextPipe=pipes.find(p=>p.x+60>bird.x);
if(nextPipe){
let middle=(nextPipe.top+nextPipe.bottom)/2;
if(bird.y>middle){bird.velocity=-jump;}
}
}

bird.velocity+=gravity;
bird.y+=bird.velocity;

pipes.forEach(p=>{
p.x-=gameSpeed;

ctx.fillStyle="green";
ctx.fillRect(p.x,0,70,p.top);
ctx.fillRect(p.x,p.bottom,70,canvas.height-p.bottom);

if(!adminMode){
if(bird.x+22>p.x && bird.x-22<p.x+70){
if(bird.y-16<p.top || bird.y+16>p.bottom){
gameOver();
}
}
}

if(!p.passed && p.x+70<bird.x){
p.passed=true;
score++;
document.getElementById("score").innerText=score;
gameSpeed=baseSpeed+(score*0.12);

if(score%10===0)spawnCoin();
}
});

// Coin
if(coin){
coin.x-=gameSpeed;
drawCoin();
if(Math.hypot(bird.x-coin.x,bird.y-coin.y)<20){
score+=3;
coin=null;
}
}

if(!adminMode){
if(bird.y>canvas.height||bird.y<0)gameOver();
}
}

drawBird();
requestAnimationFrame(update);
}
update();

// ===== GAME OVER =====
function gameOver(){
gameState="menu";
lofi.pause();
gameoverSound.play();

coins+=score;
localStorage.setItem("coins",coins);
document.getElementById("coinCount").innerText=coins;

if(score>bestScore){
bestScore=score;
localStorage.setItem("best",bestScore);
}

document.getElementById("bestScore").innerText=bestScore;
backMenu();
}

// ===== CONTROLES =====
document.addEventListener("click",()=>{if(gameState==="playing")bird.velocity=-jump;});
document.addEventListener("touchstart",()=>{if(gameState==="playing")bird.velocity=-jump;});
document.addEventListener("keydown",(e)=>{
if(e.code==="Space"&&gameState==="playing")bird.velocity=-jump;
if(e.code==="Enter"&&gameState==="menu")startGame();
});

// Cheats
document.addEventListener("keydown",(e)=>{
keysPressed[e.key.toLowerCase()]=true;

if(keysPressed["q"]&&keysPressed["w"]&&keysPressed["e"]){
adminMode=!adminMode;
}

if(keysPressed["i"]&&keysPressed["o"]&&keysPressed["p"]){
coins+=99999999;
localStorage.setItem("coins",coins);
document.getElementById("coinCount").innerText=coins;
}
});

document.addEventListener("keyup",(e)=>{
delete keysPressed[e.key.toLowerCase()];
});

</script>
</body>
</html>
